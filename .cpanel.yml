---
deployment:
  tasks:
    - export DEPLOYPATH=/home/isandybe/public_html/zenmind/
    # Backup live db.php so credentials are never overwritten
    - cp $DEPLOYPATH/db.php $DEPLOYPATH/db_live.php || true
    # Deploy all files
    - /bin/cp -R * $DEPLOYPATH
    # Restore live db.php from backup
    - cp $DEPLOYPATH/db_live.php $DEPLOYPATH/db.php || true
    # Cleanup temp backup
    - rm -f $DEPLOYPATH/db_live.php
